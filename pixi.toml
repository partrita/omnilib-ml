[workspace]
name = "omnilib-ml"
version = "0.1.0"
description = "Official repository for the paper Hypervariable loop profiling decodes sequence determinants of antibody stability."
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
numpy = ">=2.5.5,<3"
pandas = ">=3.1.1,<4"
scikit-learn = ">=1.9.1,<2"
matplotlib = ">=3.11.2,<4"
seaborn = ">=0.13.2,<0.14"
notebook = ">=7.6.5,<8"
biopython = ">=1.88,<2"
levenshtein = ">=0.27.5,<0.28"
captum = ">=0.9.0,<0.10"